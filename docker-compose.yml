services:
  # One-off job: trains a model and writes it to the shared ./models volume.
  #   docker compose run --rm trainer               (real data in ./data/raw)
  #   docker compose run --rm trainer --synthetic   (no download needed)
  trainer:
    build:
      context: .
      dockerfile: services/trainer/Dockerfile
    volumes:
      - ./data:/data
      - ./models:/models
    profiles: ["train"]

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    ports:
      - "8050:8050"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
